<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0F12"/>
      <stop offset="100%" stop-color="#161920"/>
    </linearGradient>
    <linearGradient id="curveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CCFF00"/>
      <stop offset="100%" stop-color="#FF5500"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#bgGrad)"/>

  <!-- En-tête -->
  <g transform="translate(60, 50)">
    <rect x="0" y="0" width="1480" height="90" rx="16" fill="#161920" stroke="#FF5500" stroke-opacity="0.3" stroke-width="1.5"/>
    <circle cx="45" cy="45" r="22" fill="#FF5500" fill-opacity="0.15"/>
    <text x="45" y="52" fill="#FF5500" font-family="system-ui" font-weight="900" font-size="18" text-anchor="middle">CS</text>
    <text x="85" y="42" fill="#FFFFFF" font-family="system-ui" font-weight="900" font-size="22">CampusSave — Espace Commerçant &amp; Moteur IA</text>
    <text x="85" y="65" fill="#94A3B8" font-family="system-ui" font-size="13">1. Onboarding Géolocalisé • 2. Magic Publisher IA • 3. Courbe Smart Decay • 4. Scanner QR Caméra &amp; Code</text>
    <rect x="1310" y="30" width="140" height="32" rx="8" fill="#FF5500" fill-opacity="0.1" stroke="#FF5500" stroke-opacity="0.4"/>
    <text x="1380" y="51" fill="#FF5500" font-family="system-ui" font-weight="bold" font-size="12" text-anchor="middle">ESPACE PARTENAIRE</text>
  </g>

  <!-- Écran 1 : Onboarding Géolocalisé (MapPicker) -->
  <g transform="translate(60, 170)">
    <rect width="345" height="770" rx="20" fill="#161920" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1.5"/>
    <rect width="345" height="50" rx="20" fill="#202530"/>
    <text x="172" y="30" fill="#94A3B8" font-family="system-ui" font-size="11" text-anchor="middle">campussave.tn/merchant/onboarding</text>

    <text x="25" y="85" fill="#FF5500" font-family="system-ui" font-weight="bold" font-size="10">ÉTAPE 1 / 2</text>
    <text x="25" y="110" fill="#FFFFFF" font-family="system-ui" font-weight="900" font-size="16">Rejoindre le Réseau</text>

    <!-- Inputs -->
    <rect x="25" y="130" width="295" height="42" rx="10" fill="#0D0F12" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="40" y="156" fill="#FFFFFF" font-family="system-ui" font-size="12">Baguette &amp; Baguette Montfleury</text>

    <rect x="25" y="185" width="295" height="42" rx="10" fill="#0D0F12" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="40" y="211" fill="#FFFFFF" font-family="system-ui" font-size="12">+216 71 390 120</text>

    <!-- MapPicker Preview -->
    <rect x="25" y="245" width="295" height="230" rx="14" fill="#080C14" stroke="#CCFF00" stroke-opacity="0.3"/>
    <circle cx="172" cy="360" r="10" fill="#FF5500"/>
    <circle cx="172" cy="360" r="22" fill="none" stroke="#FF5500" stroke-opacity="0.5"/>
    <text x="172" y="330" fill="#FFFFFF" font-family="system-ui" font-weight="bold" font-size="11" text-anchor="middle">📍 12 Rue de Mauritanie, Montfleury</text>
    <rect x="70" y="420" width="205" height="28" rx="8" fill="#CCFF00" fill-opacity="0.2"/>
    <text x="172" y="438" fill="#CCFF00" font-family="system-ui" font-weight="bold" font-size="11" text-anchor="middle">✓ Rayon Campus : 180m (&le; 3km)</text>

    <!-- Document Upload -->
    <rect x="25" y="495" width="295" height="90" rx="12" fill="#0D0F12" stroke="#FFFFFF" stroke-opacity="0.1" stroke-dasharray="4 4"/>
    <text x="172" y="535" fill="#64748B" font-family="system-ui" font-size="11" text-anchor="middle">📷 Glissez votre Registre de Commerce</text>
    <text x="172" y="555" fill="#94A3B8" font-family="system-ui" font-size="10" text-anchor="middle">(PNG, JPG, PDF &le; 5Mo)</text>

    <!-- Submit Button -->
    <rect x="25" y="620" width="295" height="48" rx="12" fill="#FF5500"/>
    <text x="172" y="650" fill="#FFFFFF" font-family="system-ui" font-weight="900" font-size="13" text-anchor="middle">SOUMETTRE MON DOSSIER →</text>
  </g>

  <!-- Écran 2 : Magic Offer Publisher IA -->
  <g transform="translate(435, 170)">
    <rect width="345" height="770" rx="20" fill="#161920" stroke="#CCFF00" stroke-opacity="0.3" stroke-width="1.5"/>
    <rect width="345" height="50" rx="20" fill="#202530"/>
    <text x="172" y="30" fill="#94A3B8" font-family="system-ui" font-size="11" text-anchor="middle">campussave.tn/merchant/offers/new</text>

    <text x="25" y="85" fill="#CCFF00" font-family="system-ui" font-weight="bold" font-size="10">ASSISTANT INTELLIGENT</text>
    <text x="25" y="110" fill="#FFFFFF" font-family="system-ui" font-weight="900" font-size="16">Magic Publisher IA ✨</text>

    <!-- AI Prompt Box -->
    <rect x="25" y="130" width="295" height="120" rx="14" fill="#0D0F12" stroke="#CCFF00" stroke-opacity="0.4"/>
    <text x="40" y="160" fill="#CCFF00" font-family="system-ui" font-weight="bold" font-size="11">💡 Saisie vocale ou texte brute :</text>
    <text x="40" y="185" fill="#CBD5E1" font-family="system-ui" font-size="11">"Il me reste 4 baguettes farcies</text>
    <text x="40" y="205" fill="#CBD5E1" font-family="system-ui" font-size="11">escalope fromage, prix normal 7800,</text>
    <text x="40" y="225" fill="#CBD5E1" font-family="system-ui" font-size="11">je liquide à 3800 avant 17h30"</text>

    <!-- Magic Button -->
    <rect x="25" y="265" width="295" height="42" rx="10" fill="#CCFF00"/>
    <text x="172" y="291" fill="#000000" font-family="system-ui" font-weight="900" font-size="12" text-anchor="middle">⚡ AUTO-REMPLIR AVEC L'IA</text>

    <!-- Auto-filled form fields -->
    <text x="25" y="335" fill="#94A3B8" font-family="system-ui" font-size="11">Titre extrait :</text>
    <rect x="25" y="345" width="295" height="38" rx="8" fill="#0D0F12" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="40" y="369" fill="#FFFFFF" font-family="system-ui" font-size="12">Baguette Farcie Escalope &amp; Mozzarella</text>

    <text x="25" y="405" fill="#94A3B8" font-family="system-ui" font-size="11">Catégorie &amp; Quantité :</text>
    <rect x="25" y="415" width="140" height="38" rx="8" fill="#0D0F12" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="40" y="439" fill="#CCFF00" font-family="system-ui" font-size="12">SANDWICH</text>
    <rect x="180" y="415" width="140" height="38" rx="8" fill="#0D0F12" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="195" y="439" fill="#FFFFFF" font-family="system-ui" font-size="12">Quantité : 4</text>

    <!-- Smart Decay Preview -->
    <text x="25" y="480" fill="#CCFF00" font-family="system-ui" font-weight="bold" font-size="11">Courbe Smart Decay calculée :</text>
    <rect x="25" y="495" width="295" height="110" rx="12" fill="#0D0F12" stroke="#CCFF00" stroke-opacity="0.3"/>
    <path d="M 45 580 Q 150 540 285 515" fill="none" stroke="url(#curveGrad)" stroke-width="3"/>
    <circle cx="45" cy="580" r="4" fill="#CCFF00"/>
    <circle cx="285" cy="515" r="4" fill="#FF5500"/>
    <text x="50" y="570" fill="#CCFF00" font-family="system-ui" font-size="10">3,800 DT (plancher)</text>
    <text x="240" y="510" fill="#FF5500" font-family="system-ui" font-size="10">7,800 DT</text>

    <rect x="25" y="630" width="295" height="46" rx="12" fill="#CCFF00"/>
    <text x="172" y="658" fill="#000000" font-family="system-ui" font-weight="900" font-size="13" text-anchor="middle">PUBLIER SUR LE CAMPUS →</text>
  </g>

  <!-- Écran 3 : Scanner de Retrait Commerçant (Caméra) -->
  <g transform="translate(810, 170)">
    <rect width="345" height="770" rx="20" fill="#161920" stroke="#00E5FF" stroke-opacity="0.3" stroke-width="1.5"/>
    <rect width="345" height="50" rx="20" fill="#202530"/>
    <text x="172" y="30" fill="#94A3B8" font-family="system-ui" font-size="11" text-anchor="middle">campussave.tn/merchant/scan</text>

    <text x="25" y="85" fill="#00E5FF" font-family="system-ui" font-weight="bold" font-size="10">VALIDATION INSTANTANÉE</text>
    <text x="25" y="110" fill="#FFFFFF" font-family="system-ui" font-weight="900" font-size="16">Scanner Living Ticket</text>

    <!-- Camera Viewfinder -->
    <rect x="25" y="130" width="295" height="300" rx="16" fill="#000000" stroke="#00E5FF" stroke-opacity="0.4"/>
    <!-- Viewfinder brackets -->
    <path d="M 50 170 L 50 150 L 70 150" fill="none" stroke="#00E5FF" stroke-width="4"/>
    <path d="M 295 170 L 295 150 L 275 150" fill="none" stroke="#00E5FF" stroke-width="4"/>
    <path d="M 50 390 L 50 410 L 70 410" fill="none" stroke="#00E5FF" stroke-width="4"/>
    <path d="M 295 390 L 295 410 L 275 410" fill="none" stroke="#00E5FF" stroke-width="4"/>

    <!-- Laser Scanning Line -->
    <line x1="50" y1="280" x2="295" y2="280" stroke="#CCFF00" stroke-width="2"/>
    <text x="172" y="350" fill="#94A3B8" font-family="system-ui" font-size="11" text-anchor="middle">Pointez la caméra vers le QR étudiant</text>

    <!-- Manual Code Alternative -->
    <rect x="25" y="455" width="295" height="150" rx="14" fill="#0D0F12" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="45" y="485" fill="#FFFFFF" font-family="system-ui" font-weight="bold" font-size="12">Ou saisissez le code 6 chiffres :</text>
    <rect x="45" y="505" width="255" height="42" rx="10" fill="#161920" stroke="#CCFF00" stroke-opacity="0.3"/>
    <text x="172" y="532" fill="#CCFF00" font-family="monospace" font-weight="bold" font-size="18" text-anchor="middle">8 4 9 2 0 1</text>
    <rect x="45" y="555" width="255" height="34" rx="8" fill="#00E5FF"/>
    <text x="172" y="577" fill="#000000" font-family="system-ui" font-weight="900" font-size="11" text-anchor="middle">VALIDER LE RETRAIT</text>
  </g>

  <!-- Écran 4 : Validation Atomique Réussie -->
  <g transform="translate(1185, 170)">
    <rect width="355" height="770" rx="20" fill="#161920" stroke="#4ADE80" stroke-opacity="0.4" stroke-width="1.5"/>
    <rect width="355" height="50" rx="20" fill="#202530"/>
    <text x="177" y="30" fill="#94A3B8" font-family="system-ui" font-size="11" text-anchor="middle">campussave.tn/merchant/success</text>

    <!-- Success Container -->
    <g transform="translate(25, 100)">
      <circle cx="152" cy="80" r="45" fill="#4ADE80" fill-opacity="0.15"/>
      <circle cx="152" cy="80" r="32" fill="#4ADE80"/>
      <text x="152" y="90" fill="#000000" font-family="system-ui" font-weight="bold" font-size="28" text-anchor="middle">✓</text>

      <text x="152" y="160" fill="#FFFFFF" font-family="system-ui" font-weight="900" font-size="18" text-anchor="middle">Retrait Validé avec Succès !</text>
      <text x="152" y="185" fill="#94A3B8" font-family="system-ui" font-size="12" text-anchor="middle">Commande passée à COMPLETED</text>

      <rect x="0" y="220" width="305" height="230" rx="16" fill="#0D0F12" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <text x="20" y="255" fill="#94A3B8" font-family="system-ui" font-size="11">Bénéficiaire :</text>
      <text x="285" y="255" fill="#FFFFFF" font-family="system-ui" font-weight="bold" font-size="11" text-anchor="end">Ritej Bejaoui (3A E-Biz)</text>

      <text x="20" y="295" fill="#94A3B8" font-family="system-ui" font-size="11">Article remis :</text>
      <text x="285" y="295" fill="#CCFF00" font-family="system-ui" font-weight="bold" font-size="11" text-anchor="end">1x Baguette Farcie</text>

      <text x="20" y="335" fill="#94A3B8" font-family="system-ui" font-size="11">Montant encaissé :</text>
      <text x="285" y="335" fill="#FFFFFF" font-family="system-ui" font-weight="bold" font-size="11" text-anchor="end">3,800 DT (Konnect)</text>

      <text x="20" y="375" fill="#94A3B8" font-family="system-ui" font-size="11">EcoPoints crédités :</text>
      <text x="285" y="375" fill="#4ADE80" font-family="system-ui" font-weight="bold" font-size="11" text-anchor="end">+20 pts</text>

      <rect x="0" y="475" width="305" height="46" rx="12" fill="#4ADE80"/>
      <text x="152" y="503" fill="#000000" font-family="system-ui" font-weight="900" font-size="13" text-anchor="middle">SCANNER UNE AUTRE COMMANDE</text>
    </g>
  </g>
</svg>
