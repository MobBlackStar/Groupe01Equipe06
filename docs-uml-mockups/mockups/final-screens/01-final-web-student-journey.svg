<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0F12"/>
      <stop offset="100%" stop-color="#161920"/>
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CCFF00"/>
      <stop offset="100%" stop-color="#4ADE80"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5500"/>
      <stop offset="100%" stop-color="#FFAA00"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1000" fill="url(#bgGrad)"/>

  <!-- En-tête -->
  <g transform="translate(60, 50)">
    <rect x="0" y="0" width="1480" height="90" rx="16" fill="#161920" stroke="#CCFF00" stroke-opacity="0.3" stroke-width="1.5"/>
    <circle cx="45" cy="45" r="22" fill="#CCFF00" fill-opacity="0.15"/>
    <text x="45" y="52" fill="#CCFF00" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="18" text-anchor="middle">CS</text>
    <text x="85" y="42" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22">CampusSave — Parcours Étudiant Web React</text>
    <text x="85" y="65" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13">1. Découverte Catalogue • 2. Holo-Radar 3D • 3. Réservation 10-Min • 4. Living Ticket Tournant 30s</text>
    <rect x="1310" y="30" width="140" height="32" rx="8" fill="#CCFF00" fill-opacity="0.1" stroke="#CCFF00" stroke-opacity="0.4"/>
    <text x="1380" y="51" fill="#CCFF00" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="12" text-anchor="middle">ESSECT 2026</text>
  </g>

  <!-- Écran 1 : Catalogue & Price Ticker -->
  <g transform="translate(60, 170)">
    <rect width="345" height="770" rx="20" fill="#161920" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1.5"/>
    <!-- Top bar -->
    <rect width="345" height="50" rx="20" fill="#202530"/>
    <circle cx="25" cy="25" r="5" fill="#FF5500"/>
    <circle cx="40" cy="25" r="5" fill="#FFAA00"/>
    <circle cx="55" cy="25" r="5" fill="#CCFF00"/>
    <text x="172" y="30" fill="#94A3B8" font-family="system-ui" font-size="11" text-anchor="middle">campussave.tn/app/explore</text>

    <!-- Content -->
    <text x="25" y="85" fill="#CCFF00" font-family="system-ui" font-weight="bold" font-size="10">CATALOGUE ANTI-GASPI</text>
    <text x="25" y="110" fill="#FFFFFF" font-family="system-ui" font-weight="900" font-size="16">Offres Montfleury (≤ 3km)</text>

    <!-- Search box -->
    <rect x="25" y="125" width="295" height="36" rx="10" fill="#0D0F12" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="45" y="148" fill="#64748B" font-family="system-ui" font-size="11">🔍 Makloub, baguette, ojja...</text>

    <!-- Offer Card 1 : Dutch Decay -->
    <rect x="25" y="180" width="295" height="260" rx="16" fill="#0D0F12" stroke="#CCFF00" stroke-opacity="0.3"/>
    <rect x="25" y="180" width="295" height="110" rx="16" fill="#2D3748"/>
    <text x="172" y="240" fill="#A0AEC0" font-family="system-ui" font-size="12" text-anchor="middle">🥪 Baguette Farcie Escalope</text>
    <rect x="35" y="190" width="90" height="22" rx="6" fill="#CCFF00" fill-opacity="0.9"/>
    <text x="80" y="205" fill="#000000" font-family="system-ui" font-weight="bold" font-size="10" text-anchor="middle">SMART DECAY</text>

    <text x="40" y="315" fill="#FFFFFF" font-family="system-ui" font-weight="bold" font-size="13">Baguette Farcie Panée</text>
    <text x="40" y="335" fill="#94A3B8" font-family="system-ui" font-size="11">Baguette &amp; Baguette • 180m</text>

    <text x="40" y="375" fill="#94A3B8" font-family="system-ui" font-size="11" text-decoration="line-through">7,800 DT</text>
    <text x="40" y="405" fill="#CCFF00" font-family="system-ui" font-weight="900" font-size="20">3,800 DT</text>
    <rect x="180" y="380" width="125" height="36" rx="10" fill="#CCFF00"/>
    <text x="242" y="403" fill="#000000" font-family="system-ui" font-weight="900" font-size="11" text-anchor="middle">RÉSERVER →</text>

    <!-- Offer Card 2 : Mystery Box -->
    <rect x="25" y="460" width="295" height="260" rx="16" fill="#0D0F12" stroke="#FFAA00" stroke-opacity="0.4"/>
    <rect x="25" y="460" width="295" height="110" rx="16" fill="#3B2A10"/>
    <text x="172" y="520" fill="#FFAA00" font-family="system-ui" font-size="30" text-anchor="middle">🎁</text>
    <rect x="35" y="470" width="85" height="22" rx="6" fill="#FFAA00"/>
    <text x="77" y="485" fill="#000000" font-family="system-ui" font-weight="bold" font-size="10" text-anchor="middle">MYSTERY BOX</text>

    <text x="40" y="595" fill="#FFFFFF" font-family="system-ui" font-weight="bold" font-size="13">Panier Surprise Viennoiseries</text>
    <text x="40" y="615" fill="#94A3B8" font-family="system-ui" font-size="11">L'Étoile du Savoir • Rareté OR</text>
    <text x="40" y="685" fill="#CCFF00" font-family="system-ui" font-weight="900" font-size="20">2,500 DT</text>
    <rect x="180" y="660" width="125" height="36" rx="10" fill="#FFAA00"/>
    <text x="242" y="683" fill="#000000" font-family="system-ui" font-weight="900" font-size="11" text-anchor="middle">DÉCOUVRIR →</text>
  </g>

  <!-- Écran 2 : Holo-Radar 3D WebGL -->
  <g transform="translate(435, 170)">
    <rect width="345" height="770" rx="20" fill="#161920" stroke="#00E5FF" stroke-opacity="0.3" stroke-width="1.5"/>
    <rect width="345" height="50" rx="20" fill="#202530"/>
    <circle cx="25" cy="25" r="5" fill="#FF5500"/>
    <circle cx="40" cy="25" r="5" fill="#FFAA00"/>
    <circle cx="55" cy="25" r="5" fill="#CCFF00"/>
    <text x="172" y="30" fill="#94A3B8" font-family="system-ui" font-size="11" text-anchor="middle">campussave.tn/app/radar</text>

    <!-- Radar Map Canvas Simulation -->
    <rect x="15" y="65" width="315" height="500" rx="14" fill="#080C14"/>
    <!-- Grid rings -->
    <circle cx="172" cy="300" r="140" fill="none" stroke="#00E5FF" stroke-opacity="0.1" stroke-dasharray="4 4"/>
    <circle cx="172" cy="300" r="90" fill="none" stroke="#00E5FF" stroke-opacity="0.15"/>
    <circle cx="172" cy="300" r="40" fill="none" stroke="#00E5FF" stroke-opacity="0.2"/>

    <!-- ESSECT Beacon (Center) -->
    <circle cx="172" cy="300" r="10" fill="#CCFF00" filter="url(#glow)"/>
    <circle cx="172" cy="300" r="18" fill="none" stroke="#CCFF00" stroke-opacity="0.6"/>
    <text x="172" y="335" fill="#CCFF00" font-family="system-ui" font-weight="bold" font-size="11" text-anchor="middle">ESSECT Montfleury</text>

    <!-- Merchant 1 : Baguette -->
    <line x1="172" y1="300" x2="240" y2="210" stroke="#CCFF00" stroke-width="2" stroke-dasharray="4 3"/>
    <polygon points="240,200 250,215 230,215" fill="#CCFF00"/>
    <text x="255" y="210" fill="#FFFFFF" font-family="system-ui" font-size="10">Baguette (180m)</text>

    <!-- Merchant 2 : Etoile -->
    <polygon points="120,220 130,235 110,235" fill="#FFAA00"/>
    <text x="60" y="235" fill="#FFFFFF" font-family="system-ui" font-size="10">L'Étoile (120m)</text>

    <!-- Merchant 3 : Le Dome -->
    <polygon points="230,380 240,395 220,395" fill="#FF5500"/>
    <text x="220" y="415" fill="#FFFFFF" font-family="system-ui" font-size="10">Le Dôme (350m)</text>

    <!-- Selected Merchant Bottom Sheet -->
    <rect x="15" y="580" width="315" height="165" rx="14" fill="#0D0F12" stroke="#CCFF00" stroke-opacity="0.4"/>
    <text x="35" y="615" fill="#CCFF00" font-family="system-ui" font-weight="bold" font-size="12">COMMERCE SÉLECTIONNÉ</text>
    <text x="35" y="640" fill="#FFFFFF" font-family="system-ui" font-weight="900" font-size="14">Baguette &amp; Baguette Montfleury</text>
    <text x="35" y="660" fill="#94A3B8" font-family="system-ui" font-size="11">🚶 2 min de marche • 4 paniers disponibles</text>
    <rect x="35" y="685" width="275" height="38" rx="10" fill="#CCFF00"/>
    <text x="172" y="709" fill="#000000" font-family="system-ui" font-weight="900" font-size="12" text-anchor="middle">VOIR LES 4 OFFRES →</text>
  </g>

  <!-- Écran 3 : Checkout 10-Min & Verrouillage de Prix -->
  <g transform="translate(810, 170)">
    <rect width="345" height="770" rx="20" fill="#161920" stroke="#FF5500" stroke-opacity="0.3" stroke-width="1.5"/>
    <rect width="345" height="50" rx="20" fill="#202530"/>
    <circle cx="25" cy="25" r="5" fill="#FF5500"/>
    <circle cx="40" cy="25" r="5" fill="#FFAA00"/>
    <circle cx="55" cy="25" r="5" fill="#CCFF00"/>
    <text x="172" y="30" fill="#94A3B8" font-family="system-ui" font-size="11" text-anchor="middle">campussave.tn/app/checkout</text>

    <!-- Countdown Timer -->
    <rect x="25" y="75" width="295" height="70" rx="14" fill="#FF5500" fill-opacity="0.1" stroke="#FF5500" stroke-opacity="0.4"/>
    <text x="172" y="100" fill="#FF5500" font-family="system-ui" font-weight="bold" font-size="11" text-anchor="middle">TEMPS RESTANT POUR PAYER</text>
    <text x="172" y="132" fill="#FFFFFF" font-family="system-ui" font-weight="900" font-size="24" text-anchor="middle">08:42</text>

    <!-- Order Summary Card -->
    <rect x="25" y="165" width="295" height="240" rx="16" fill="#0D0F12" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="45" y="200" fill="#FFFFFF" font-family="system-ui" font-weight="bold" font-size="14">Récapitulatif de Commande</text>
    <text x="45" y="225" fill="#94A3B8" font-family="system-ui" font-size="11">Code : CS-8K4M9</text>

    <line x1="45" y1="245" x2="300" y2="245" stroke="#FFFFFF" stroke-opacity="0.1"/>

    <text x="45" y="275" fill="#CBD5E1" font-family="system-ui" font-size="12">1x Baguette Farcie Escalope</text>
    <text x="295" y="275" fill="#FFFFFF" font-family="system-ui" font-weight="bold" font-size="12" text-anchor="end">3,800 DT</text>

    <text x="45" y="305" fill="#4ADE80" font-family="system-ui" font-size="12">Économie anti-gaspi</text>
    <text x="295" y="305" fill="#4ADE80" font-family="system-ui" font-weight="bold" font-size="12" text-anchor="end">-4,000 DT</text>

    <line x1="45" y1="330" x2="300" y2="330" stroke="#FFFFFF" stroke-opacity="0.1"/>

    <text x="45" y="365" fill="#FFFFFF" font-family="system-ui" font-weight="900" font-size="14">Total Verrouillé</text>
    <text x="295" y="365" fill="#CCFF00" font-family="system-ui" font-weight="900" font-size="18" text-anchor="end">3,800 DT</text>

    <!-- Coupon selector -->
    <rect x="25" y="425" width="295" height="60" rx="12" fill="#0D0F12" stroke="#CCFF00" stroke-opacity="0.3"/>
    <text x="45" y="450" fill="#CCFF00" font-family="system-ui" font-weight="bold" font-size="11">🎁 Bon de fidélité appliqué</text>
    <text x="45" y="470" fill="#94A3B8" font-family="system-ui" font-size="10">-20% palier 100 EcoPoints (Déduit)</text>

    <!-- Konnect Button -->
    <rect x="25" y="520" width="295" height="50" rx="14" fill="#CCFF00"/>
    <text x="172" y="552" fill="#000000" font-family="system-ui" font-weight="900" font-size="14" text-anchor="middle">PAYER AVEC KONNECT →</text>

    <text x="172" y="600" fill="#64748B" font-family="system-ui" font-size="11" text-anchor="middle">Annuler la réservation (libère le stock)</text>
  </g>

  <!-- Écran 4 : Living Ticket Boarding Pass QR 30s -->
  <g transform="translate(1185, 170)">
    <rect width="355" height="770" rx="20" fill="#161920" stroke="#CCFF00" stroke-opacity="0.4" stroke-width="1.5"/>
    <rect width="355" height="50" rx="20" fill="#202530"/>
    <circle cx="25" cy="25" r="5" fill="#FF5500"/>
    <circle cx="40" cy="25" r="5" fill="#FFAA00"/>
    <circle cx="55" cy="25" r="5" fill="#CCFF00"/>
    <text x="177" y="30" fill="#94A3B8" font-family="system-ui" font-size="11" text-anchor="middle">campussave.tn/app/ticket</text>

    <!-- Boarding Pass Container -->
    <g transform="translate(20, 75)">
      <rect width="315" height="540" rx="24" fill="#0D0F12" stroke="#CCFF00" stroke-opacity="0.5" stroke-width="2"/>

      <!-- Perforations latérales -->
      <circle cx="0" cy="280" r="14" fill="#161920"/>
      <circle cx="315" cy="280" r="14" fill="#161920"/>

      <!-- Header Boarding Pass -->
      <rect width="315" height="60" rx="24" fill="#252A36"/>
      <text x="25" y="35" fill="#CCFF00" font-family="system-ui" font-weight="900" font-size="14">ESSECT ➔ MONTFLEURY</text>
      <rect x="220" y="18" width="70" height="24" rx="6" fill="#CCFF00"/>
      <text x="255" y="34" fill="#000000" font-family="system-ui" font-weight="900" font-size="11" text-anchor="middle">LIVE 30S</text>

      <!-- Details -->
      <text x="25" y="95" fill="#FFFFFF" font-family="system-ui" font-weight="bold" font-size="15">Baguette Farcie Escalope</text>
      <text x="25" y="115" fill="#94A3B8" font-family="system-ui" font-size="11">Baguette &amp; Baguette • Retrait avant 17h30</text>

      <!-- Rotating HMAC QR Simulation -->
      <rect x="57" y="140" width="200" height="200" rx="16" fill="#FFFFFF"/>
      <!-- QR Blocks -->
      <rect x="75" y="158" width="45" height="45" fill="#000000"/>
      <rect x="85" y="168" width="25" height="25" fill="#FFFFFF"/>
      <rect x="195" y="158" width="45" height="45" fill="#000000"/>
      <rect x="75" y="278" width="45" height="45" fill="#000000"/>
      <circle cx="157" cy="240" r="16" fill="#CCFF00"/>

      <!-- 30s Countdown Bar -->
      <rect x="25" y="365" width="265" height="8" rx="4" fill="#252A36"/>
      <rect x="25" y="365" width="180" height="8" rx="4" fill="#CCFF00"/>
      <text x="157" y="395" fill="#94A3B8" font-family="system-ui" font-size="11" text-anchor="middle">Actualisation automatique dans 18s</text>

      <!-- Code de secours 6 chiffres -->
      <line x1="25" y1="420" x2="290" y2="420" stroke="#FFFFFF" stroke-opacity="0.1" stroke-dasharray="4 4"/>
      <text x="157" y="450" fill="#64748B" font-family="system-ui" font-size="11" text-anchor="middle">Code de secours manuel :</text>
      <text x="157" y="485" fill="#CCFF00" font-family="monospace" font-weight="900" font-size="24" text-anchor="middle">8 4 9 2 0 1</text>
      <text x="157" y="515" fill="#4ADE80" font-family="system-ui" font-weight="bold" font-size="10" text-anchor="middle">✓ Billet certifié cryptographiquement</text>
    </g>

    <text x="177" y="660" fill="#94A3B8" font-family="system-ui" font-size="11" text-anchor="middle">Présentez ce billet au comptoir à Montfleury</text>
  </g>
</svg>
