<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0F12"/>
      <stop offset="100%" stop-color="#161920"/>
    </linearGradient>
    <filter id="phoneShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#bgGrad)"/>

  <!-- En-tête -->
  <g transform="translate(60, 50)">
    <rect x="0" y="0" width="1480" height="90" rx="16" fill="#161920" stroke="#00E5FF" stroke-opacity="0.3" stroke-width="1.5"/>
    <circle cx="45" cy="45" r="22" fill="#00E5FF" fill-opacity="0.15"/>
    <text x="45" y="52" fill="#00E5FF" font-family="system-ui" font-weight="900" font-size="18" text-anchor="middle">CS</text>
    <text x="85" y="42" fill="#FFFFFF" font-family="system-ui" font-weight="900" font-size="22">CampusSave — Application Mobile Flutter 3 &amp; Dart</text>
    <text x="85" y="65" fill="#94A3B8" font-family="system-ui" font-size="13">1. Student Shell (5 Onglets) • 2. Holo-Radar Tactile • 3. Unboxing Haptique • 4. Carte Fidélité Éco-Digitale</text>
    <rect x="1310" y="30" width="140" height="32" rx="8" fill="#00E5FF" fill-opacity="0.1" stroke="#00E5FF" stroke-opacity="0.4"/>
    <text x="1380" y="51" fill="#00E5FF" font-family="system-ui" font-weight="bold" font-size="12" text-anchor="middle">FLUTTER NATIVE</text>
  </g>

  <!-- Phone 1 : Student Shell (Explore + Bottom Nav) -->
  <g transform="translate(100, 180)" filter="url(#phoneShadow)">
    <!-- Smartphone Frame -->
    <rect width="300" height="620" rx="40" fill="#0D0F12" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="4"/>
    <!-- Dynamic Island / Speaker notch -->
    <rect x="100" y="12" width="100" height="18" rx="9" fill="#000000"/>

    <!-- App Screen -->
    <g transform="translate(16, 40)">
      <rect width="268" height="560" rx="24" fill="#161920"/>

      <!-- Header -->
      <text x="15" y="35" fill="#CCFF00" font-family="system-ui" font-weight="bold" font-size="10">CAMPUS ESSECT</text>
      <text x="15" y="55" fill="#FFFFFF" font-family="system-ui" font-weight="900" font-size="16">Repas Sauvés 🌱</text>

      <!-- Search bar -->
      <rect x="15" y="70" width="238" height="34" rx="10" fill="#0D0F12" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <text x="30" y="92" fill="#64748B" font-family="system-ui" font-size="10">Rechercher une offre...</text>

      <!-- Offer Card Mobile -->
      <rect x="15" y="115" width="238" height="175" rx="14" fill="#0D0F12" stroke="#CCFF00" stroke-opacity="0.3"/>
      <rect x="15" y="115" width="238" height="75" rx="14" fill="#2D3748"/>
      <text x="134" y="155" fill="#A0AEC0" font-family="system-ui" font-size="11" text-anchor="middle">🥪 Baguette Farcie</text>
      <text x="25" y="210" fill="#FFFFFF" font-family="system-ui" font-weight="bold" font-size="12">Baguette Escalope Panée</text>
      <text x="25" y="226" fill="#94A3B8" font-family="system-ui" font-size="10">Baguette &amp; Baguette • 180m</text>
      <text x="25" y="260" fill="#CCFF00" font-family="system-ui" font-weight="900" font-size="16">3,800 DT</text>
      <rect x="145" y="242" width="98" height="28" rx="8" fill="#CCFF00"/>
      <text x="194" y="260" fill="#000000" font-family="system-ui" font-weight="bold" font-size="10" text-anchor="middle">RÉSERVER</text>

      <!-- Bottom Nav Bar (5 onglets) -->
      <rect x="0" y="505" width="268" height="55" rx="20" fill="#0D0F12" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <text x="27" y="530" fill="#CCFF00" font-family="system-ui" font-size="14" text-anchor="middle">🛍️</text>
      <text x="27" y="546" fill="#CCFF00" font-family="system-ui" font-size="8" text-anchor="middle">Explorer</text>

      <text x="80" y="530" fill="#64748B" font-family="system-ui" font-size="14" text-anchor="middle">🗺️</text>
      <text x="80" y="546" fill="#64748B" font-family="system-ui" font-size="8" text-anchor="middle">Radar</text>

      <text x="134" y="530" fill="#64748B" font-family="system-ui" font-size="14" text-anchor="middle">🎟️</text>
      <text x="134" y="546" fill="#64748B" font-family="system-ui" font-size="8" text-anchor="middle">Billets</text>

      <text x="187" y="530" fill="#64748B" font-family="system-ui" font-size="14" text-anchor="middle">🎁</text>
      <text x="187" y="546" fill="#64748B" font-family="system-ui" font-size="8" text-anchor="middle">Fidélité</text>

      <text x="241" y="530" fill="#64748B" font-family="system-ui" font-size="14" text-anchor="middle">📊</text>
      <text x="241" y="546" fill="#64748B" font-family="system-ui" font-size="8" text-anchor="middle">Impact</text>
    </g>
  </g>

  <!-- Phone 2 : Flutter Radar Screen -->
  <g transform="translate(460, 180)" filter="url(#phoneShadow)">
    <rect width="300" height="620" rx="40" fill="#0D0F12" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="4"/>
    <rect x="100" y="12" width="100" height="18" rx="9" fill="#000000"/>

    <g transform="translate(16, 40)">
      <rect width="268" height="560" rx="24" fill="#080C14"/>

      <!-- Map Radar Circles -->
      <circle cx="134" cy="220" r="100" fill="none" stroke="#00E5FF" stroke-opacity="0.15" stroke-dasharray="4 4"/>
      <circle cx="134" cy="220" r="60" fill="none" stroke="#00E5FF" stroke-opacity="0.2"/>
      <circle cx="134" cy="220" r="12" fill="#CCFF00"/>
      <circle cx="134" cy="220" r="24" fill="none" stroke="#CCFF00" stroke-opacity="0.4"/>
      <text x="134" y="260" fill="#CCFF00" font-family="system-ui" font-weight="bold" font-size="10" text-anchor="middle">ESSECT Campus</text>

      <polygon points="190,160 198,172 182,172" fill="#CCFF00"/>
      <text x="190" y="152" fill="#FFFFFF" font-family="system-ui" font-size="9" text-anchor="middle">Baguette 180m</text>

      <polygon points="80,180 88,192 72,192" fill="#FFAA00"/>
      <text x="80" y="172" fill="#FFFFFF" font-family="system-ui" font-size="9" text-anchor="middle">L'Étoile 120m</text>

      <!-- Bottom Sheet Slider -->
      <rect x="0" y="380" width="268" height="180" rx="20" fill="#161920" stroke="#CCFF00" stroke-opacity="0.3"/>
      <rect x="114" y="390" width="40" height="4" rx="2" fill="#64748B"/>
      <text x="20" y="420" fill="#CCFF00" font-family="system-ui" font-weight="bold" font-size="10">PROXIMITÉ IMMÉDIATE</text>
      <text x="20" y="440" fill="#FFFFFF" font-family="system-ui" font-weight="900" font-size="13">Baguette &amp; Baguette Montfleury</text>
      <text x="20" y="460" fill="#94A3B8" font-family="system-ui" font-size="10">🚶 2 min à pied • 4 invendus restants</text>
      <rect x="20" y="480" width="228" height="36" rx="10" fill="#CCFF00"/>
      <text x="134" y="502" fill="#000000" font-family="system-ui" font-weight="900" font-size="11" text-anchor="middle">OUVRIR LA COMMANDE</text>
    </g>
  </g>

  <!-- Phone 3 : Unboxing Reveal Animation -->
  <g transform="translate(820, 180)" filter="url(#phoneShadow)">
    <rect width="300" height="620" rx="40" fill="#0D0F12" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="4"/>
    <rect x="100" y="12" width="100" height="18" rx="9" fill="#000000"/>

    <g transform="translate(16, 40)">
      <rect width="268" height="560" rx="24" fill="#0D0F12"/>

      <text x="134" y="45" fill="#FFAA00" font-family="system-ui" font-weight="bold" font-size="10" text-anchor="middle">CÉRÉMONIE D'OUVERTURE</text>
      <text x="134" y="70" fill="#FFFFFF" font-family="system-ui" font-weight="900" font-size="15" text-anchor="middle">Panier Surprise Révélé ! 🎁</text>

      <!-- Glowing Box -->
      <circle cx="134" cy="180" r="60" fill="#FFAA00" fill-opacity="0.15"/>
      <rect x="84" y="130" width="100" height="100" rx="20" fill="#FFAA00"/>
      <text x="134" y="195" fill="#000000" font-family="system-ui" font-size="45" text-anchor="middle">✨</text>

      <!-- Revealed items cascade -->
      <rect x="20" y="270" width="228" height="50" rx="12" fill="#161920" stroke="#CCFF00" stroke-opacity="0.4"/>
      <text x="35" y="300" fill="#FFFFFF" font-family="system-ui" font-weight="bold" font-size="11">🥐 2x Croissants Pur Beurre Dorés</text>

      <rect x="20" y="330" width="228" height="50" rx="12" fill="#161920" stroke="#CCFF00" stroke-opacity="0.4"/>
      <text x="35" y="360" fill="#FFFFFF" font-family="system-ui" font-weight="bold" font-size="11">🍫 2x Pains au Chocolat Croustillants</text>

      <rect x="20" y="400" width="228" height="40" rx="10" fill="#CCFF00" fill-opacity="0.15"/>
      <text x="134" y="425" fill="#CCFF00" font-family="system-ui" font-weight="900" font-size="12" text-anchor="middle">+20 EcoPoints Crédités ⭐</text>

      <rect x="20" y="460" width="228" height="38" rx="10" fill="#FFAA00"/>
      <text x="134" y="484" fill="#000000" font-family="system-ui" font-weight="900" font-size="11" text-anchor="middle">DÉGUSTER MON REPAS</text>
    </g>
  </g>

  <!-- Phone 4 : Carte Fidélité Éco-Digitale -->
  <g transform="translate(1180, 180)" filter="url(#phoneShadow)">
    <rect width="300" height="620" rx="40" fill="#0D0F12" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="4"/>
    <rect x="100" y="12" width="100" height="18" rx="9" fill="#000000"/>

    <g transform="translate(16, 40)">
      <rect width="268" height="560" rx="24" fill="#161920"/>

      <text x="15" y="35" fill="#4ADE80" font-family="system-ui" font-weight="bold" font-size="10">FIDÉLITÉ ÉCO-RESPONSABLE</text>
      <text x="15" y="55" fill="#FFFFFF" font-family="system-ui" font-weight="900" font-size="16">Mon Pass Végétal 🌿</text>

      <!-- Apple Pass Card -->
      <rect x="15" y="75" width="238" height="170" rx="18" fill="#0D0F12" stroke="#CCFF00" stroke-opacity="0.5"/>
      <text x="30" y="105" fill="#CCFF00" font-family="system-ui" font-weight="bold" font-size="11">CAMPUSSAVE PASS</text>
      <text x="30" y="130" fill="#FFFFFF" font-family="system-ui" font-weight="900" font-size="18">Ritej Bejaoui</text>
      <text x="30" y="150" fill="#94A3B8" font-family="system-ui" font-size="10">Palier : POUSSE (280 pts)</text>

      <!-- 5-Stamp Grid -->
      <text x="30" y="180" fill="#CCFF00" font-family="system-ui" font-size="9" font-weight="bold">CYCLE EN COURS (4 / 5 TAMPONS) :</text>
      <circle cx="45" cy="210" r="14" fill="#CCFF00"/>
      <text x="45" y="215" fill="#000000" font-size="12" text-anchor="middle">✓</text>

      <circle cx="85" cy="210" r="14" fill="#CCFF00"/>
      <text x="85" y="215" fill="#000000" font-size="12" text-anchor="middle">✓</text>

      <circle cx="125" cy="210" r="14" fill="#CCFF00"/>
      <text x="125" y="215" fill="#000000" font-size="12" text-anchor="middle">✓</text>

      <circle cx="165" cy="210" r="14" fill="#CCFF00"/>
      <text x="165" y="215" fill="#000000" font-size="12" text-anchor="middle">✓</text>

      <circle cx="205" cy="210" r="14" fill="none" stroke="#CCFF00" stroke-dasharray="3 3"/>
      <text x="205" y="215" fill="#CCFF00" font-size="12" text-anchor="middle">🎁</text>

      <!-- Active Coupons Wallet -->
      <text x="15" y="275" fill="#FFFFFF" font-family="system-ui" font-weight="bold" font-size="12">Mes Bons Débloqués</text>

      <rect x="15" y="295" width="238" height="55" rx="12" fill="#0D0F12" stroke="#4ADE80" stroke-opacity="0.4"/>
      <text x="25" y="320" fill="#4ADE80" font-family="system-ui" font-weight="bold" font-size="12">-20% sur votre commande</text>
      <text x="25" y="338" fill="#94A3B8" font-family="system-ui" font-size="9">Palier 100 pts • Valide à Montfleury</text>

      <rect x="15" y="360" width="238" height="55" rx="12" fill="#0D0F12" stroke="#FFAA00" stroke-opacity="0.4"/>
      <text x="25" y="385" fill="#FFAA00" font-family="system-ui" font-weight="bold" font-size="12">Panier Surprise 100% Offert</text>
      <text x="25" y="403" fill="#94A3B8" font-family="system-ui" font-size="9">Palier 300 pts • Prochain déblocage dans 20 pts</text>

      <rect x="15" y="450" width="238" height="38" rx="10" fill="#CCFF00"/>
      <text x="134" y="474" fill="#000000" font-family="system-ui" font-weight="900" font-size="11" text-anchor="middle">UTILISER UN BON AU PANIER →</text>
    </g>
  </g>
</svg>
