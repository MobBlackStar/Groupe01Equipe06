name: campussave_mobile
description: "Application Mobile CampusSave pour étudiants et commerçants de l'ESSECT."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Gestion d'état et navigation
  provider: ^6.1.2
  go_router: ^14.6.2

  # Réseau HTTP & APIs
  dio: ^5.7.0

  # Firebase Suite
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  firebase_messaging: ^15.1.5

  # QR Code & Scanner
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # Cryptographie
  crypto: ^3.0.6

  # Cartographie & Géolocalisation
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Médias & WebView
  image_picker: ^1.1.2
  webview_flutter: ^4.10.0

  # Graphiques & Visualisations
  fl_chart: ^0.69.2

  # Utilitaires UI
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/brand/

  # Polices du site web (OFL), embarquées pour fonctionner hors-ligne sur le téléphone
  fonts:
    - family: Oswald
      fonts:
        - asset: assets/fonts/Oswald.ttf
    - family: LeagueGothic
      fonts:
        - asset: assets/fonts/LeagueGothic.ttf
    - family: Anton
      fonts:
        - asset: assets/fonts/Anton-Regular.ttf
    - family: BowlbyOneSC
      fonts:
        - asset: assets/fonts/BowlbyOneSC-Regular.ttf
    - family: Knewave
      fonts:
        - asset: assets/fonts/Knewave-Regular.ttf
    - family: SpaceMono
      fonts:
        - asset: assets/fonts/SpaceMono-Regular.ttf
        - asset: assets/fonts/SpaceMono-Bold.ttf
          weight: 700
